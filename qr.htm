<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>掃描並產生 QR PNG</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      text-align: center;
      padding: 1em;
    }

    button {
      padding: 6px 9px;
    }

    video {
      width: 100%;
      border-radius: 1em;
      background: #000;
    }

    #result {
      width: 100%;
    }

    #qrcode {
      width: 100%;
    }
  </style>
</head>

<body>

  <button class="scan-btn">開始掃描</button></p>

  <p><video id="video" playsinline hidden></video></p>

  <input
    id="result"
    type="text"
    placeholder="掃描結果會顯示在這裡"
    readonly
  >

  <img id="qrcode" alt="QR Code" hidden>

  <p><mark>長按 QR 圖片即可分享或儲存</mark></p>

  <button class="scan-btn">重新掃描</button>

  <script>
    const video = document.querySelector('#video')
    const result = document.querySelector('#result')
    const qrImage = document.querySelector('#qrcode')
    const scanBtns = document.querySelectorAll('.scan-btn')

    let stream = null
    let detector = null
    let scanning = false

    if (!('BarcodeDetector' in window)) {
      alert('此瀏覽器不支援 BarcodeDetector API')

      scanBtns.forEach(btn => btn.disabled = true)
    } else {
      detector = new BarcodeDetector({
        formats: ['qr_code']
      })
    }

    scanBtns.forEach(btn => {
      btn.addEventListener('click', startScan)
    })

    async function startScan() {
      if (scanning) return

      stopCamera()

      scanning = true

      result.value = ''
      qrImage.src = ''
      qrImage.hidden = true

      video.hidden = false

      scanBtns.forEach(btn => btn.disabled = true)

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: 'environment'
            }
          }
        })

        video.srcObject = stream

        await video.play()

        detectLoop()
      } catch (err) {
        scanning = false

        video.hidden = true

        scanBtns.forEach(btn => btn.disabled = false)

        alert(`無法開啟相機：${err.message}`)
      }
    }

    async function detectLoop() {
      if (!scanning) return

      try {
        const codes = await detector.detect(video)

        if (codes.length) {
          const text = codes[0].rawValue

          scanning = false

          stopCamera()

          result.value = text

          const png = await QRCode.toDataURL(text, {
            width: 512,
            margin: 2
          })

          qrImage.src = png
          qrImage.hidden = false
          video.hidden = true

          scanBtns.forEach(btn => btn.disabled = false)

          return
        }
      } catch (err) {
        console.error(err)
      }

      requestAnimationFrame(detectLoop)
    }

    function stopCamera() {
      scanning = false

      if (stream) {
        stream.getTracks().forEach(track => track.stop())
        stream = null
      }

      video.pause()
      video.srcObject = null
      video.hidden = true
    }

    window.addEventListener('beforeunload', stopCamera)
  </script>

</body>
</html>
